# ============================================================
#  VeriChain AI Logistics - Application Configuration
# ============================================================

# Server
server.port=8080

# ============================================================
# DATABASE — PostgreSQL (Clever Cloud)
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# HikariCP — stay within Clever Cloud free tier connection limit
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# ============================================================
# JWT SECURITY
# ============================================================
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# ============================================================
# AI MICROSERVICE URL (Python FastAPI)
# ============================================================
app.ai.service.url=${APP_AI_SERVICE_URL:http://localhost:8000}

# ============================================================
# BLOCKCHAIN (Web3j / Ethereum Sepolia)
# ============================================================
app.blockchain.rpc-url=https://sepolia.infura.io/v3/YOUR_INFURA_PROJECT_ID
app.blockchain.private-key=YOUR_WALLET_PRIVATE_KEY_HERE
app.blockchain.contract-address=YOUR_DEPLOYED_CONTRACT_ADDRESS_HERE
app.blockchain.enabled=${APP_BLOCKCHAIN_ENABLED:false}

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging
logging.level.com.verichain=INFO
logging.level.org.springframework.security=WARN
