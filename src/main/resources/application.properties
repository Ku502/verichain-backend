# ============================================================
#  VeriChain AI Logistics - Application Configuration
# ============================================================

# Server
server.port=8080

# ============================================================
# DATABASE — H2 (Dev)
# For Railway/Render production, override these via env vars:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# ============================================================
spring.datasource.url=jdbc:h2:mem:verichaindb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console — disable this in production
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# JWT SECURITY
# Replace the secret with a 256-bit random string in production
# ============================================================
app.jwt.secret=VeriChainSuperSecretKeyForJWTTokenSigning2024MustBe256BitsLong!
app.jwt.expiration-ms=86400000

# ============================================================
# AI MICROSERVICE URL (Python FastAPI)
# Override with live Render URL in production:
#   AI_SERVICE_URL=https://verichain-ai-engine.onrender.com
# ============================================================
app.ai.service.url=http://localhost:8000

# ============================================================
# BLOCKCHAIN (Web3j / Ethereum Sepolia)
# Set these as environment variables — NEVER hardcode real keys
# ============================================================
app.blockchain.rpc-url=https://sepolia.infura.io/v3/YOUR_INFURA_PROJECT_ID
app.blockchain.private-key=YOUR_WALLET_PRIVATE_KEY_HERE
app.blockchain.contract-address=YOUR_DEPLOYED_CONTRACT_ADDRESS_HERE
app.blockchain.enabled=false

# ============================================================
# CORS — Update origin for your live Netlify URL
# ============================================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://your-site.netlify.app

# Logging
logging.level.com.verichain=INFO
logging.level.org.springframework.security=WARN
